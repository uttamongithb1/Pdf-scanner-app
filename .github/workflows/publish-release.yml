name: Publish verified GitHub preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
      - 'scripts/publish_release.py'
      - 'docs/releases/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: github-preview-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release publisher
        run: python3 -m unittest discover -s test -p '*_test.py'
      - name: Publish pinned, tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_release.py
